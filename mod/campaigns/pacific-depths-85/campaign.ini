[Language_en]
Name=Pacific Depths '85
Description=Pacific Depths '85 is a submarine-only linear campaign following a U.S. Navy patrol from Hokkaido to the Soviet bastion in the Sea of Okhotsk.<LineBreak/><LineBreak/><Span Foreground="SandyBrown">NOTE</Span>: All directly controlled units are submarines. Optional intelligence missions never block the main line.

[Language_cn]
Name=太平洋深渊 1985
Description=《太平洋深渊》是一场纯潜艇线性战役，跟随美国海军从北海道一路进入苏联鄂霍次克海堡垒。<LineBreak/><LineBreak/><Span Foreground="SandyBrown">NOTE</Span>: All directly controlled units are submarines. Optional intelligence missions never block the main line.

[Language_ru]
Name=Тихоокеанские глубины '85
Description=Линейная кампания только для подводных лодок ВМС США: от Хоккайдо до советского бастиона в Охотском море.<LineBreak/><LineBreak/><Span Foreground="SandyBrown">NOTE</Span>: All directly controlled units are submarines. Optional intelligence missions never block the main line.

[Language_de]
Name=Pacific Depths '85
Description=Eine lineare Kampagne ausschließlich für U-Boote der US Navy – von Hokkaido bis zur sowjetischen Bastion im Ochotskischen Meer.<LineBreak/><LineBreak/><Span Foreground="SandyBrown">NOTE</Span>: All directly controlled units are submarines. Optional intelligence missions never block the main line.

[Language_ja]
Name=パシフィック・デプス '85
Description=北海道からソ連のオホーツク海バスチオンまでを描く米海軍潜水艦専用の一本道キャンペーン。<LineBreak/><LineBreak/><Span Foreground="SandyBrown">NOTE</Span>: All directly controlled units are submarines. Optional intelligence missions never block the main line.

[Language_es]
Name=Profundidades del Pacífico '85
Description=Campaña lineal exclusiva de submarinos de la Armada estadounidense, desde Hokkaido hasta el bastión soviético del mar de Ojotsk.<LineBreak/><LineBreak/><Span Foreground="SandyBrown">NOTE</Span>: All directly controlled units are submarines. Optional intelligence missions never block the main line.

[Language_fr]
Name=Profondeurs du Pacifique '85
Description=Campagne linéaire exclusivement sous-marine de l'US Navy, d'Hokkaido au bastion soviétique de la mer d'Okhotsk.<LineBreak/><LineBreak/><Span Foreground="SandyBrown">NOTE</Span>: All directly controlled units are submarines. Optional intelligence missions never block the main line.

[Language_ko]
Name=퍼시픽 뎁스 '85
Description=홋카이도에서 소련 오호츠크해 요새까지 이어지는 미 해군 잠수함 전용 선형 캠페인입니다.<LineBreak/><LineBreak/><Span Foreground="SandyBrown">NOTE</Span>: All directly controlled units are submarines. Optional intelligence missions never block the main line.

[Language_vn]
Name=Độ sâu Thái Bình Dương '85
Description=Chiến dịch tuyến tính chỉ huy tàu ngầm Hải quân Hoa Kỳ từ Hokkaido tới pháo đài Liên Xô ở biển Okhotsk.<LineBreak/><LineBreak/><Span Foreground="SandyBrown">NOTE</Span>: All directly controlled units are submarines. Optional intelligence missions never block the main line.

